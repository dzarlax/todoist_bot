version: '3.8'
services:
  todoist_bot:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: todoist_dev
    ports:
      - "3000:3000"
    volumes:
      - ./src:/usr/src/app/src
      - ./src/logs:/usr/src/app/logs
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_LEVEL: debug
      NODE_ENV: development
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
